<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wholesome</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #fff; }
    body { min-height: 100vh; overflow-x: hidden; color: #000; }

    .home {
      position: relative;
      min-height: 100vh;
      width: 100%;
      background: #fff;
    }

    .hero {
      position: absolute;
      left: 3.90625vw;
      top: 6.0546875vh;
      width: 77.1484375vw;
      height: auto;
      display: block;
    }

    .nav {
      position: absolute;
      left: 82.10vw;
      top: 44.7vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.48em;
      font-family: Didot, "Bodoni 72", "Times New Roman", serif;
      font-size: clamp(22px, 1.58vw, 34px);
      line-height: 1.08;
      letter-spacing: 0.13em;
      white-space: nowrap;
    }

    .nav a {
      color: inherit;
      text-decoration: none;
    }

    .nav a:hover { opacity: .55; }

    .wordmark {
      position: absolute;
      left: 50%;
      top: 87.0vh;
      transform: translateX(-50%);
      font-family: Didot, "Bodoni 72", "Times New Roman", serif;
      font-size: clamp(22px, 1.62vw, 35px);
      line-height: 1;
      letter-spacing: 0.13em;
      white-space: nowrap;
    }

    @media (max-width: 720px) {
      .home { min-height: 100svh; }

      .hero {
        position: relative;
        left: auto;
        top: auto;
        width: calc(100% - 28px);
        margin: 22px 14px 0;
      }

      .nav {
        position: relative;
        left: auto;
        top: auto;
        margin: 24px 22px 0 auto;
        width: max-content;
        align-items: center;
        font-size: 20px;
      }

      .wordmark {
        position: absolute;
        top: auto;
        bottom: 28px;
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <main class="home">
    <img class="hero" src="assets/home.jpg" alt="">
    <nav class="nav" aria-label="Main navigation">
      <a href="#">DISCOGRAPHY</a>
      <a href="#">CONTACT</a>
    </nav>
    <div class="wordmark">WHOLESOME</div>
  </main>
</body>
</html>
