<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Wholesome</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #fff; }
    body { color: #111; font-family: Arial, Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }
    main { width: 100%; min-height: 100vh; padding: 28px clamp(18px, 4vw, 56px) 120px; }
    .profile { width: min(100%, 460px); }
    .portrait { display: block; width: 100%; height: auto; }
    .profile h1 { margin: 24px 0 0; font-size: clamp(23px, 2.35vw, 32px); line-height: 1.16; font-weight: 700; letter-spacing: -.035em; }
    .profile-name { font-size: .67em; font-weight: 400; letter-spacing: -.02em; white-space: nowrap; }
    .profile p { margin: 12px 0 0; font-size: clamp(11px, 1.23vw, 17px); font-weight: 400; line-height: 1.3; letter-spacing: -.012em; white-space: nowrap; }

    .discography { width: min(100%, 460px); margin-top: 104px; }
    .year + .year { margin-top: 92px; }
    .year h2 { margin: 0 0 30px; font-size: clamp(27px, 3vw, 36px); line-height: 1.1; font-weight: 700; letter-spacing: -.025em; }
    .release { margin: 0; min-width: 0; }
    .release--single { width: min(100%, 300px); }
    .release figcaption { margin-top: 12px; font-size: clamp(14px, 1.35vw, 17px); font-weight: 700; line-height: 1.25; }
    .release-image { display: block; width: 100%; height: auto; }
    .release--hard-rub { margin-top: 44px; }
    .release--kid-blast { margin-top: 44px; }
    .release-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 44px; }
    .release-pair--2022 { margin-top: 0; }
    .release-pair--2022 .release figcaption { font-size: clamp(7px, 2vw, 11px); letter-spacing: -.04em; line-height: 1.35; white-space: nowrap; }
    .release--video { width: 100%; }
    .video-embed { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; background: #111; }
    .release-role { margin: 8px 0 0; font-size: clamp(13px, 1.25vw, 16px); line-height: 1.4; }

    .exhibitions { width: min(100%, 460px); margin-top: 92px; }
    .fastercrap-artwork { width: min(100%, 300px); margin: 0 0 50px; }
    .fastercrap-artwork img { display: block; width: 100%; height: auto; }
    .fastercrap-artwork figcaption { margin-top: 12px; font-size: clamp(8px, 2vw, 13px); font-weight: 700; line-height: 1.25; letter-spacing: -.035em; white-space: nowrap; }
    .exhibition-video { display: block; width: 100%; margin-bottom: 14px; background: #000; }
    .exhibition-title { margin: 0; font-size: clamp(16px, 1.65vw, 20px); line-height: 1.3; font-weight: 700; }
    .exhibition-location, .exhibition-credit { margin: 6px 0 0; font-size: clamp(13px, 1.25vw, 16px); line-height: 1.4; }
    .exhibition-credit { margin-top: 10px; }
    @media (max-width: 600px) {
      main { padding: 20px 18px 88px; }
      .profile h1 { margin-top: 21px; font-size: clamp(21px, 5.8vw, 27px); }
      .profile p { margin-top: 10px; font-size: clamp(10px, 2.95vw, 14px); }
      .discography { margin-top: 78px; }
      .year h2 { margin-bottom: 24px; }
      .release-pair { gap: 14px; margin-top: 36px; }
      .release-pair--2022 { margin-top: 0; }
      .release--hard-rub { margin-top: 36px; }
      .release--kid-blast { margin-top: 36px; }
      .release figcaption { font-size: clamp(12px, 3.4vw, 15px); }
      .year + .year { margin-top: 76px; }
      .exhibitions { margin-top: 76px; }
      .release--single, .fastercrap-artwork { width: 100%; max-width: none; }
      .fastercrap-artwork { margin-bottom: 42px; }
    }
    @media (min-width: 900px) {
      .discography { width: 100%; }
      .discography .year {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 300px));
        gap: 36px 28px;
        align-items: start;
      }
      .discography .year h2 { grid-column: 1 / -1; margin-bottom: 0; }
      .discography .release-pair { display: contents; }
      .discography .release { width: 100%; margin: 0; }
      .discography .release figcaption {
        font-size: 15px;
        letter-spacing: normal;
        line-height: 1.3;
        white-space: normal;
      }
      .discography .release--video { grid-column: span 2; }
    }
  </style>
</head>
<body>
  <main>
    <section class="profile" aria-label="Artist profile">
      <img class="portrait" src="assets/profile.webp" width="320" height="376" alt="Wholesome portrait">
      <h1>Wholesome <span class="profile-name">(Hwang Saebyeog)</span></h1>
      <p>Lives In Seoul, Specialized in Making Music &amp; Love</p>
    </section>

    <section class="discography" aria-label="Discography">
      <section class="year" aria-labelledby="year-2026">
        <h2 id="year-2026">2026</h2>
        <figure class="release release--single">
          <img class="release-image" src="assets/stash.jpg" width="1200" height="1200" alt="Stash cover artwork" loading="lazy">
          <figcaption>Stash</figcaption>
        </figure>
        <div class="release-pair">
          <figure class="release">
            <img class="release-image" src="assets/canopy-laughter.jpg" width="1200" height="1200" alt="Canopy Laughter cover artwork" loading="lazy">
            <figcaption>Canopy Laughter</figcaption>
          </figure>
          <figure class="release">
            <img class="release-image" src="assets/coil-breaks.jpg" width="1200" height="1200" alt="Coil Breaks cover artwork" loading="lazy">
            <figcaption>Coil Breaks</figcaption>
          </figure>
        </div>
        <figure class="release release--single release--kid-blast">
          <img class="release-image" src="assets/kid-blast-officer-a2o.jpg" alt="Kid Blast Officer / A2O artwork" loading="lazy">
          <figcaption>Kid Blast 'Officer / A2O'</figcaption>
        </figure>
      </section>

      <section class="year" aria-labelledby="year-2025">
        <h2 id="year-2025">2025</h2>
        <figure class="release release--single">
          <img class="release-image" src="assets/top-beats.jpg" width="1200" height="1200" alt="TOP BEATS cover artwork" loading="lazy">
          <figcaption>TOP BEATS</figcaption>
        </figure>
        <figure class="release release--single release--hard-rub">
          <img class="release-image" src="assets/hard-rub-reissue.jpg" width="1125" height="1125" loading="lazy" alt="Blue DJ Dream Dog Hard Rub cassette and sleeve">
          <figcaption>DJ Dream Dog 'Hard Rub Vol. I / II', Ormolyca Reissue</figcaption>
        </figure>
      </section>

      <section class="year" aria-labelledby="year-2023">
        <h2 id="year-2023">2023</h2>
        <div class="release-pair release-pair--2022">
          <figure class="release">
            <img class="release-image" src="assets/2022-dog-collage.jpg" alt="DJ Dream Dog Worst Odds cover artwork" loading="lazy">
            <figcaption>DJ Dream Dog 'Worst Odds'</figcaption>
          </figure>
        </div>
      </section>

      <section class="year" aria-labelledby="year-2022">
        <h2 id="year-2022">2022</h2>
        <div class="release-pair release-pair--2022">
          <figure class="release">
            <img class="release-image" src="assets/hard-rub-vol2.jpg" width="1400" height="1400" alt="Hard Rub Volume Two original artwork with a plush dog and tracklist" loading="lazy">
            <figcaption>DJ Dream Dog 'Hard Rub Vol.2'</figcaption>
          </figure>
          <figure class="release">
            <img class="release-image" src="assets/the-burners-burn-me-away.jpg" width="1200" height="1200" alt="The Burners Burn Me Away cover artwork" loading="lazy">
            <figcaption>The Burners 'Burn Me Away'</figcaption>
          </figure>
        </div>
      </section>

      <section class="year" aria-labelledby="year-2021">
        <h2 id="year-2021">2021</h2>
        <figure class="release release--video">
          <iframe class="video-embed" src="https://www.youtube-nocookie.com/embed/hrMyOYXaEUM" title="Dead Man Calling x Vans - Playground Junkie" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
          <figcaption>Dead Man Calling × Vans 'Playground Junkie'</figcaption>
          <p class="release-role">Original Music &amp; Production — Wholesome</p>
        </figure>
      </section>

      <section class="year" aria-labelledby="year-2020">
        <h2 id="year-2020">2020</h2>
        <figure class="release release--single">
          <img class="release-image" src="assets/hard-rub-vol1.jpg" alt="Blue original Hard Rub Vol. 1 sleeve artwork, with gloves and track list" loading="lazy">
          <figcaption>DJ Dream Dog - Hard Rub Vol.1</figcaption>
        </figure>
        <figure class="release release--single release--hard-rub">
          <img class="release-image" src="assets/heat-haze-mix.jpg" alt="Heat Haze Mix artwork" loading="lazy">
          <figcaption>Heat Haze Mix</figcaption>
        </figure>
      </section>

      <section class="year" aria-labelledby="year-2019">
        <h2 id="year-2019">2019</h2>
        <figure class="release release--single">
          <img class="release-image" src="assets/bits-and-pieces.jpg" width="839" height="839" alt="Wholesome Bits &amp; Pieces cover artwork" loading="lazy">
          <figcaption>Bits &amp; Pieces</figcaption>
        </figure>
      </section>
    </section>

    <section class="exhibitions" aria-label="Exhibitions">
      <section class="year" aria-labelledby="year-2018">
        <h2 id="year-2018">2018</h2>
        <figure class="fastercrap-artwork">
          <img src="assets/fastercrap-for-everythingelse.jpg" width="1125" height="1121" alt="Fastercrap For Everythingelse artwork" loading="lazy">
          <figcaption>Fastercrap For Everythingelse (DJ Dream Dog &amp; Hukky Shibaseki)</figcaption>
        </figure>
        <article class="exhibition">
          <video class="exhibition-video" controls playsinline loop preload="metadata" poster="assets/perception-poster.jpg">
            <source src="assets/perception-exhibition.mp4" type="video/mp4">
            Your browser does not support video playback.
          </video>
          <h3 class="exhibition-title">Perception Exhibition</h3>
          <p class="exhibition-location">@ Asia Culture Center</p>
          <p class="exhibition-credit">(co-worked with JungchoongJin, Park Seunghyuk)</p>
        </article>
      </section>
    </section>
  </main>
</body>
</html>
