name: Import profile header collage
on:
  push:
    paths:
      - '.github/workflows/import-profile-header.yml'
permissions:
  contents: write
jobs:
  import-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download uploaded profile header
        env:
          HEADER_URL: 'https://at.adobe.com/e1CIB0FYago0vnV0'
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 --silent --show-error "$HEADER_URL" --output assets/profile-header.png
          test "$(stat -c%s assets/profile-header.png)" -gt 50000
          python3 - <<'PY'
          from pathlib import Path
          data=Path("assets/profile-header.png").read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', "Invalid PNG"
          print("Verified PNG:", len(data), "bytes")
          PY
      - name: Commit profile header
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-header.png
          git commit -m "Add new profile header collage"
          git push
