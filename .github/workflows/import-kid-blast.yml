name: Import Kid Blast artwork
on:
  push:
    paths:
      - '.github/workflows/import-kid-blast.yml'
permissions:
  contents: write
jobs:
  import-artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download supplied artwork
        env:
          ARTWORK_URL: 'https://at.adobe.com/pwXlV1WtRn93PIeA'
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 --silent --show-error "$ARTWORK_URL" --output assets/kid-blast-officer-a2o.jpg
          test "$(stat -c%s assets/kid-blast-officer-a2o.jpg)" -gt 50000
          python3 - <<'PY'
          from pathlib import Path
          data=Path('assets/kid-blast-officer-a2o.jpg').read_bytes()
          assert data[:3]==bytes.fromhex('ffd8ff') and data[-2:]==bytes.fromhex('ffd9'), 'Invalid JPEG'
          print('Verified Kid Blast artwork:',len(data),'bytes')
          PY
      - name: Commit artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/kid-blast-officer-a2o.jpg
          git commit -m "Add Kid Blast Officer A2O artwork"
          git push
