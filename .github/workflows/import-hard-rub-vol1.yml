name: Import Hard Rub Vol. 1 artwork
on:
  push:
    paths:
      - '.github/workflows/import-hard-rub-vol1.yml'
permissions:
  contents: write
jobs:
  import-artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download supplied cover artwork
        env:
          ARTWORK_URL: 'https://at.adobe.com/zEmYunYUY0ptmndr'
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 --silent --show-error "$ARTWORK_URL" --output assets/hard-rub-vol1.jpg
          test "$(stat -c%s assets/hard-rub-vol1.jpg)" -gt 100000
          python3 - <<'PY'
          from pathlib import Path
          data = Path("assets/hard-rub-vol1.jpg").read_bytes()
          assert data[:3] == bytes.fromhex("ffd8ff") and data[-2:] == bytes.fromhex("ffd9"), "Not a complete JPEG"
          print("Valid Hard Rub Vol. 1 JPEG:", len(data), "bytes")
          PY
      - name: Commit artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hard-rub-vol1.jpg
          git commit -m "Add DJ Dream Dog Hard Rub Vol. 1 artwork"
          git push
