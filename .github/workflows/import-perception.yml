name: Import Perception exhibition media
on:
  push:
    paths:
      - .github/workflows/import-perception.yml
      - index.html
permissions:
  contents: write
jobs:
  import-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exhibition video and cover frame
        env:
          VIDEO_URL: "https://at.adobe.com/eu5sTyXOWWXmaiIJ"
          POSTER_URL: "https://at.adobe.com/pZBuCQnxGeCPFd72"
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 --silent --show-error "$VIDEO_URL" --output assets/perception-exhibition.mp4
          curl --fail --location --retry 3 --silent --show-error "$POSTER_URL" --output assets/perception-poster.jpg
          test "$(stat -c%s assets/perception-exhibition.mp4)" -gt 1000000
          test "$(stat -c%s assets/perception-poster.jpg)" -gt 1000
          file assets/perception-exhibition.mp4 assets/perception-poster.jpg
          python3 - <<'PY'
          from pathlib import Path
          data = Path("assets/perception-exhibition.mp4").read_bytes()
          assert b"ftyp" in data[:32], "Not an MP4 file"
          assert b"mp4a" in data, "No AAC audio stream found"
          print("MP4 with AAC audio verified")
          PY
      - name: Add media to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/perception-exhibition.mp4 assets/perception-poster.jpg
          git commit -m "Add Perception exhibition video with sound and poster"
          git push
