name: Import second 2022 artwork
on:
  push:
    paths:
      - '.github/workflows/import-2022-second-artwork.yml'
permissions:
  contents: write
jobs:
  import-artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download uploaded artwork
        env:
          ARTWORK_URL: 'https://at.adobe.com/Vy6bJdRzPRToVcIL'
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 --silent --show-error "$ARTWORK_URL" --output assets/2022-dog-collage.jpg
          test "$(stat -c%s assets/2022-dog-collage.jpg)" -gt 30000
          python3 - <<'PY'
          from pathlib import Path
          data = Path('assets/2022-dog-collage.jpg').read_bytes()
          assert data[:3] == bytes.fromhex('ffd8ff') and data[-2:] == bytes.fromhex('ffd9'), 'Invalid JPEG'
          print('Verified JPEG:', len(data), 'bytes')
          PY
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/2022-dog-collage.jpg
          git commit -m "Add second 2022 artwork"
          git push
