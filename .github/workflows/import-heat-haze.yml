name: Import Heat Haze Mix artwork
on:
  push:
    paths:
      - '.github/workflows/import-heat-haze.yml'
permissions:
  contents: write
jobs:
  import-artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download supplied original artwork
        env:
          ARTWORK_URL: 'https://at.adobe.com/NkexdiXoCxBSANHN'
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 --silent --show-error "$ARTWORK_URL" --output assets/heat-haze-mix.jpg
          test "$(stat -c%s assets/heat-haze-mix.jpg)" -gt 50000
          python3 - <<'PY'
          from pathlib import Path
          data = Path("assets/heat-haze-mix.jpg").read_bytes()
          assert data[:3] == bytes.fromhex("ffd8ff") and data[-2:] == bytes.fromhex("ffd9"), "Invalid JPEG"
          print("Verified Heat Haze Mix JPEG:", len(data), "bytes")
          PY
      - name: Commit artwork to site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/heat-haze-mix.jpg
          git commit -m "Add Heat Haze Mix artwork"
          git push
